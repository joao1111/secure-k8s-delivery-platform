apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    security.platform/catalog: K01-privileged
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-system-namespace
      expression: "!(object.metadata.namespace in ['kube-system', 'kyverno'])"
  validations:
    - expression: |
        (!has(object.spec.initContainers) || object.spec.initContainers.all(container, (!has(container.securityContext) || !has(container.securityContext.privileged) || container.securityContext.privileged == false) && has(container.securityContext) && has(container.securityContext.allowPrivilegeEscalation) && container.securityContext.allowPrivilegeEscalation == false)) && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(container, (!has(container.securityContext) || !has(container.securityContext.privileged) || container.securityContext.privileged == false) && has(container.securityContext) && has(container.securityContext.allowPrivilegeEscalation) && container.securityContext.allowPrivilegeEscalation == false)) && object.spec.containers.all(container, (!has(container.securityContext) || !has(container.securityContext.privileged) || container.securityContext.privileged == false) && has(container.securityContext) && has(container.securityContext.allowPrivilegeEscalation) && container.securityContext.allowPrivilegeEscalation == false)
      message: "Privileged containers are denied. Set securityContext.privileged to false and securityContext.allowPrivilegeEscalation to false on every container. See app/fixtures/secure/web.yaml."
