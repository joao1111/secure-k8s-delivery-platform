name: live

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cluster and live proof
        run: |
          make kind-up
          make prove-live
      - name: Delete the cluster
        if: always()
        run: make kind-down
