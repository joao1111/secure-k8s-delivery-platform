name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sign:
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: app/image
          push: true
          tags: ghcr.io/joao1111/secure-k8s-delivery-platform:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/joao1111/secure-k8s-delivery-platform@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
      - uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532
        with:
          image: ghcr.io/joao1111/secure-k8s-delivery-platform@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a
      - name: Sign the digest and attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/joao1111/secure-k8s-delivery-platform@${DIGEST}"
          cosign sign --yes "$image"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$image"
      - name: Push an unsigned image with a different digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: app/image
          push: true
          tags: ghcr.io/joao1111/secure-k8s-delivery-platform:unsigned
          labels: org.opencontainers.image.description=unsigned

  verify:
    needs: sign
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject the unsigned tag and admit the signed digest
        env:
          DIGEST: ${{ needs.sign.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prove_signature.sh
