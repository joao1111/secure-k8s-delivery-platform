apiVersion: v1
kind: Pod
metadata:
  name: legacy-root
  namespace: paved-road
  labels:
    security.platform/exception: allow-legacy-root
spec:
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsUser: 0
        runAsNonRoot: false
        capabilities:
          drop:
            - ALL
