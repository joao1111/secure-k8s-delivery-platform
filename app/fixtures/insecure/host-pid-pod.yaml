apiVersion: v1
kind: Pod
metadata:
  name: host-pid-pod
  namespace: paved-road
spec:
  hostPID: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
