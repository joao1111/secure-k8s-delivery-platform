apiVersion: v1
kind: Pod
metadata:
  name: unsigned-server
  namespace: paved-road
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: server
      image: ghcr.io/joao1111/secure-k8s-delivery-platform:unsigned
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop:
            - ALL
