apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: paved-road
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
  volumes:
    - name: host
      hostPath:
        path: /etc
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      volumeMounts:
        - name: host
          mountPath: /host-etc
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
