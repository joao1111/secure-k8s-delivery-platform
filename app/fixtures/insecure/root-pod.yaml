apiVersion: v1
kind: Pod
metadata:
  name: root-pod
  namespace: paved-road
spec:
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsUser: 0
        runAsNonRoot: false
        capabilities:
          drop:
            - ALL
